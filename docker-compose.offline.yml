services:
  api:
    image: investment-dashboard-api:offline
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.offline}
      POSTGRES_DB: ${POSTGRES_DB:-investment}
      POSTGRES_USER: ${POSTGRES_USER:-investment_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.offline}
      PGHOST: db
      IMPORT_ARCHIVE_DIR: /var/lib/investment-imports
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - investment_import_files:/var/lib/investment-imports

  dashboard:
    image: investment-dashboard:offline
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DATA_BACKEND: offline
        VITE_OFFLINE_API_URL: /api/offline
    restart: unless-stopped
    ports:
      - "${OFFLINE_DASHBOARD_PORT:-8080}:80"
    depends_on:
      - api

  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investment}
      POSTGRES_USER: ${POSTGRES_USER:-investment_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.offline}
    volumes:
      - investment_postgres_data:/var/lib/postgresql/data
      - ./offline/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  investment_postgres_data:
  investment_import_files:
